<!DOCTYPE html>
<html>

<head>
    <title>GPU Shadow with Selectable Movable Shapes</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            color: #fff;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="info">Press 1 for Cube, 2 for Sphere. Use Arrow keys to move selected.</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Scene & Camera
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);

        // Lights
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(1024, 1024);
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        scene.add(dirLight);

        const ambient = new THREE.AmbientLight(0x404040);
        scene.add(ambient);

        // Shapes
        const shapes = {};

        // Cube
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        shapes.cube = new THREE.Mesh(boxGeo, boxMat);
        shapes.cube.castShadow = true;
        scene.add(shapes.cube);

        // Sphere
        const sphereGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const sphereMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
        shapes.sphere = new THREE.Mesh(sphereGeo, sphereMat);
        shapes.sphere.position.set(2, 0.5, 0);
        shapes.sphere.castShadow = true;
        scene.add(shapes.sphere);

        // Ground
        const planeGeo = new THREE.PlaneGeometry(10, 10);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.5;
        plane.receiveShadow = true;
        scene.add(plane);

        // Selection
        let selected = shapes.cube;
        function updateInfo() {
            const info = document.getElementById('info');
            const name = selected === shapes.cube ? 'Cube' : 'Sphere';
            info.textContent = `Selected: ${name} | Press 1 for Cube, 2 for Sphere. Arrow keys to move.`;
        }
        updateInfo();

        // Handle keyboard input
        window.addEventListener('keydown', (event) => {
            const step = 0.1;
            switch (event.key) {
                case '1':
                    selected = shapes.cube;
                    updateInfo();
                    break;
                case '2':
                    selected = shapes.sphere;
                    updateInfo();
                    break;
                case 'ArrowUp':
                    selected.position.z -= step;
                    break;
                case 'ArrowDown':
                    selected.position.z += step;
                    break;
                case 'ArrowLeft':
                    selected.position.x -= step;
                    break;
                case 'ArrowRight':
                    selected.position.x += step;
                    break;
            }
        });

        // Animation loop
        function animate(time) {
            const t = time * 0.001;
            shapes.cube.rotation.y = t;
            shapes.sphere.rotation.y = t;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);
    </script>
</body>

</html>
