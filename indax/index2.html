<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>Final (GLB example)</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <!-- three.js r128 + loaders (non-module builds) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dat.gui/build/dat.gui.min.js"></script>

  <script>
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Camera + controls
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(3, 1.5, 4);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.update();

    // Floor
    const planeGeo = new THREE.PlaneGeometry(20, 20);
    const planeMat = new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 0.8, metalness: 0.0 });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.receiveShadow = true;
    plane.position.y = 0;
    scene.add(plane);

    // Light
    const dirLight = new THREE.DirectionalLight(0xfff7ea, 1.0);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    scene.add(dirLight);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
    scene.add(hemi);

    // PMREM for HDR environment
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    new THREE.RGBELoader()
      .setDataType(THREE.UnsignedByteType)
      .load('https://raw.githubusercontent.com/Pongpanot99/final.github.io/main/puresky_2k.hdr',
        (hdr) => {
          const envMap = pmremGenerator.fromEquirectangular(hdr).texture;
          scene.environment = envMap;
          scene.background = envMap;
          hdr.dispose();
          pmremGenerator.dispose();
        },
        undefined,
        (err) => { console.error('HDR load error:', err); }
      );

    // GLTF / GLB loader
    const gltfLoader = new THREE.GLTFLoader();

    // <-- เปลี่ยนเป็น raw.githubusercontent ของไฟล์ .glb ของคุณ
    const glbUrl = 'https://raw.githubusercontent.com/kenxd823/ken.io/main/assets/model/model.glb';

    gltfLoader.load(
      glbUrl,
      (gltf) => {
        const model = gltf.scene || gltf.scenes[0];
        // ถ้าต้องการปรับขนาด/ตำแหน่ง
        model.scale.set(0.2, 0.2, 0.2);
        model.position.y = 0.01;

        // เปิด cast/receive shadow ให้ทุก mesh
        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            // อย่าเปลี่ยน material ของโมเดลถ้าไม่จำเป็น — GLTF มาพร้อม PBR material ที่ดีแล้ว
            // แต่ถ้าต้องการบังคับค่าสี: child.material = new THREE.MeshStandardMaterial({ color: 0xffffff });
          }
        });

        scene.add(model);
        console.log('GLB loaded', gltf);
      },
      (xhr) => {
        // progress (ถ้าต้องการ)
        // console.log( (xhr.loaded / xhr.total * 100) + '% loaded' );
      },
      (err) => {
        console.error('Error loading GLB:', err);
        // ถ้าขึ้น CORS หรือ 404 ให้เช็ค URL (ต้องเป็น raw.githubusercontent.com) และเช็คว่าไฟล์อยู่ในสาธารณะ (public repo)
      }
    );

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
