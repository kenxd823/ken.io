<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>Final (Multi GLB - Camera Anchors)</title>
  <style>
    body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100%; font-family:sans-serif; }
    canvas { display:block; width:100vw; height:100vh; }
    #ui { display:flex; flex-direction:column; gap:8px; }
    .btn { pointer-events:auto; background:rgba(0,0,0,0.55); color:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; border:1px solid rgba(255,255,255,0.08); }
    .btn.active { background:rgba(20,120,255,0.9); }
    #status { position:absolute; right:12px; top:12px; background:rgba(0,0,0,0.5); color:#fff; padding:6px 10px; border-radius:6px; font-size:13px; z-index:10;}
    .panel { pointer-events:auto; background:rgba(0,0,0,0.45); color:#fff; padding:6px; border-radius:6px; display:flex; flex-direction:column; gap:6px; min-width:120px; font-size:13px; border:1px solid rgba(255,255,255,0.06); }
    .panelTitle { font-weight:600; opacity:0.95; font-size:13px; }
    .panelRow { display:flex; gap:6px; }
    .menu { position:absolute; top:12px; left:12px; z-index:20; display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
    .menu .menuBody { pointer-events:auto; display:block; gap:8px; max-height:calc(100vh - 120px); overflow:auto; padding:6px; background:rgba(0,0,0,0.12); border-radius:6px; margin-top:6px; }
    .menu .menuBody > * { display:block; margin-bottom:8px; }
    .menu .menuBody .btn { display:block; width:220px; box-sizing:border-box; }
    .menu .menuBody .panel { width:220px; box-sizing:border-box; }
    .panelRow { display:flex; gap:6px; flex-wrap:wrap; }
    .panelRow .btn { flex:1 1 auto; min-width:80px; }
    .menu.collapsed { gap:0; }
    .menu.collapsed .menuBody { display:none; }
    .menu #menuToggle { background:rgba(0,0,0,0.75); pointer-events:auto; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:15px; color:#fff; border:1px solid rgba(255,255,255,0.08); width:44px; text-align:center; margin-bottom:6px; z-index:30; }
  </style>
</head>
<body>
  <div class="menu collapsed" id="menu">
    <div id="menuToggle" class="btn" title="Close menu">✕</div>
    <div id="ui" class="menuBody"></div>
  </div>
  <div id="menuHandle" class="btn" title="Open menu" style="display:none; position:fixed; top:12px; left:12px; z-index:40; width:44px; text-align:center">☰</div>
  <div id="status">Loading models...</div>

  <div id="preloadOverlay" style="position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.95);color:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;">
    <div style="text-align:center;max-width:420px;width:90%;">
      <h2 style="margin:0 0 12px 0;font-size:20px">กำลังดาวน์โหลดผลงาน</h2>
      <div id="prePercent" style="font-size:28px;font-weight:700;margin-bottom:10px;">0%</div>
      <div style="height:12px;background:rgba(255,255,255,0.06);border-radius:6px;overflow:hidden;margin-bottom:12px;">
        <div id="preBar" style="width:0%;height:100%;background:linear-gradient(90deg,#3aa0ff,#7bd4ff);"></div>
      </div>
      <div style="margin-bottom:12px;font-size:13px;opacity:0.85">ระบบจะโหลดจนถึง 100% แล้วคุณจะสามารถเข้าชมผลงานได้</div>
      <button id="preEnter" disabled style="padding:8px 14px;border-radius:6px;border:none;background:rgba(255,255,255,0.08);color:#fff;cursor:not-allowed">รอให้โหลดเสร็จ...</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

  <script>
  // Robustified version: better error handling for model loading and a few bugfixes
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  if ('toneMappingExposure' in renderer) renderer.toneMappingExposure = 0.32;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(4,2,6);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0,1,0);
  controls.update();

  const dirLight = new THREE.DirectionalLight(0xffffff,0.6);
  dirLight.position.set(5,10,5);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  dirLight.shadow.radius = 4;
  dirLight.shadow.bias = -0.0005;
  scene.add(dirLight);
  scene.add(new THREE.AmbientLight(0xffffff, 0.04));
  scene.add(new THREE.HemisphereLight(0xffffff,0x444444,0.12));

  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  const envIntensity = 0.07;
  function setEnvironmentIntensity(v){
    scene.traverse(o=>{
      if(o.isMesh && o.material){
        const apply = m=>{ if('envMapIntensity' in m) m.envMapIntensity = v; m.needsUpdate = true; };
        if(Array.isArray(o.material)) o.material.forEach(apply); else apply(o.material);
      }
    });
  }

  function createToonGradient(){
    const size = 256;
    const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0,0,size,0);
    grad.addColorStop(0.0, '#ffffff');
    grad.addColorStop(0.35, '#e9e9e9');
    grad.addColorStop(0.65, '#bdbdbd');
    grad.addColorStop(1.0, '#5a5a5a');
    ctx.fillStyle = grad; ctx.fillRect(0,0,size,size);
    const tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    tex.needsUpdate = true;
    return tex;
  }
  const toonGradientMap = createToonGradient();
  function toToonMaterial(oldMat){
    if(!oldMat) return oldMat;
    if(oldMat.type && oldMat.type.toLowerCase().includes('toon')) return oldMat;
    const params = {};
    if(oldMat.color) params.color = oldMat.color.clone();
    if(oldMat.map) params.map = oldMat.map;
    if(oldMat.emissive) params.emissive = oldMat.emissive.clone ? oldMat.emissive.clone() : oldMat.emissive;
    if(oldMat.emissiveMap) params.emissiveMap = oldMat.emissiveMap;
    if(oldMat.alphaTest) params.alphaTest = oldMat.alphaTest;
    if(oldMat.transparent) params.transparent = oldMat.transparent;
    if(typeof oldMat.opacity === 'number') params.opacity = oldMat.opacity;
    if(oldMat.skinning) params.skinning = oldMat.skining;
    if(oldMat.morphTargets) params.morphTargets = oldMat.morphTargets;
    if(oldMat.normalMap) params.normalMap = oldMat.normalMap;
    if(oldMat.roughness !== undefined) params.roughness = oldMat.roughness;
    if(oldMat.metalness !== undefined) params.metalness = oldMat.metalness;
    if(oldMat.roughnessMap) params.roughnessMap = oldMat.roughnessMap;
    if(oldMat.metalnessMap) params.metalnessMap = oldMat.metalnessMap;
    params.gradientMap = toonGradientMap;
    try{
      const toon = new THREE.MeshToonMaterial(params);
      if('side' in oldMat) toon.side = oldMat.side;
      if('envMapIntensity' in oldMat) toon.envMapIntensity = oldMat.envMapIntensity;
      else toon.envMapIntensity = Math.max(0.15, (oldMat && oldMat.envMapIntensity) || 0.15);
      if((!toon.emissive || toon.emissive.equals(new THREE.Color(0,0,0))) && oldMat && !oldMat.emissive){
        try{ toon.emissive = new THREE.Color(0x111111); }catch(e){}
      }
      toon.needsUpdate = true;
      return toon;
    }catch(e){ console.warn('Failed to create toon material, falling back to old material', e); return oldMat; }
  }

  new THREE.RGBELoader().setDataType(THREE.UnsignedByteType)
    .load('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/satara_night_1k.hdr',
      hdr=>{
        try{
          const envMap = pmremGenerator.fromEquirectangular(hdr).texture;
          scene.environment = envMap; scene.background = envMap;
          setEnvironmentIntensity(envIntensity);
        }finally{ hdr.dispose(); pmremGenerator.dispose(); }
      },
      undefined,
      err=>console.warn('HDR load error:',err)
    );

  const loader = new THREE.GLTFLoader();
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const ui = document.getElementById('ui');
  const menu = document.getElementById('menu');
  const menuToggle = document.getElementById('menuToggle');
  const status = document.getElementById('status');

  const RAIN_COUNT = 800;
  let rainGeo, rainMaterial, rainPoints;
  const rainVel = new Float32Array(RAIN_COUNT);
  let rainLast = performance.now();
  function initRain(){
    rainGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(RAIN_COUNT * 3);
    for(let i=0;i<RAIN_COUNT;i++){
      const x = (Math.random()-0.5) * 40;
      const y = Math.random() * 25 + 5;
      const z = (Math.random()-0.5) * 40;
      positions[i*3+0] = x;
      positions[i*3+1] = y;
      positions[i*3+2] = z;
      rainVel[i] = 15 + Math.random()*25; // units per second
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    rainMaterial = new THREE.PointsMaterial({ size:0.12, transparent:true, opacity:0.75, depthWrite:false });
    rainPoints = new THREE.Points(rainGeo, rainMaterial);
    rainPoints.frustumCulled = false;
    scene.add(rainPoints);
  }
  function updateRain(){
    if(!rainGeo) return;
    const nowR = performance.now();
    const dt = Math.min(0.1, (nowR - rainLast) / 1000);
    rainLast = nowR;
    const pos = rainGeo.attributes.position.array;
    for(let i=0;i<RAIN_COUNT;i++){
      const idx = i*3 + 1;
      pos[idx] -= rainVel[i] * dt;
      if(pos[idx] < 0){
        pos[i*3+0] = (Math.random()-0.5) * 40;
        pos[i*3+1] = Math.random() * 25 + 10;
        pos[i*3+2] = (Math.random()-0.5) * 40;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  initRain();

  const modelsMeta = [
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/main/indax/%E0%B8%9E%E0%B8%B7%E0%B9%89%E0%B8%99.glb', name:'', scale:0.5, pos:[0,0,0] },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/main/indax/name.glb', name:'นาย ภูวเรศ', scale:0.5, pos:[3,0,-3], lookAt:[3,0.9,-2.2], cameraAnchors:[[4,0,-20],[5,2,5]] },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/main/indax/%E0%B8%95%E0%B8%B6%E0%B8%81.glb', scale:0.5, pos:[0,0,0], noToon:true },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/main/indax/%E0%B8%95%E0%B8%B6%E0%B8%81.glb',  scale:0.5, pos:[1.5,0,0], noToon:true },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/main/indax/%E0%B8%95%E0%B8%B6%E0%B8%81.glb',  scale:0.5, pos:[3,0,0], noToon:true },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/main/indax/%E0%B8%95%E0%B8%B6%E0%B8%81.glb',  scale:0.5, pos:[4.5,0,0], noToon:true },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/main/indax/%E0%B8%95%E0%B8%B6%E0%B8%81.glb',  scale:0.5, pos:[6,0,0], noToon:true },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/main/indax/%E0%B8%95%E0%B8%B6%E0%B8%81.glb',  scale:0.5, pos:[7.5,0,0], noToon:true },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/main/indax/%E0%B8%95%E0%B8%B6%E0%B8%81.glb',  scale:0.5, pos:[8.5,0,0], noToon:true },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/main/indax/3%E0%B8%95%E0%B8%B1%E0%B8%A7.glb', name:'Focus: jim 3',  scale:0.5, pos:[1,0.2,0] },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/main/indax/_boos.glb', name:'Focus: boss', scale:0.5, pos:[1,0.2,0], materialProps:{ metalness:1.0, roughness:0.15 } },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/refs/heads/main/indax/bom.glb', name:'Focus: bom', scale:0.5, pos:[-5,0.7,7.5] },
    { url:'https://raw.githubusercontent.com/kenxd823/ken.io/refs/heads/main/indax/tree.glb', name:'Focus: tree', scale:5, pos:[1,0,0] }
  ];

  const skipCollisionUrlFragment = '3%E0%B8%95%E0%B8%B1%E0%B8%A7.glb';
  const models=[];
  const cameraAnchors=[];
  let loadedCount=0;
  // fix autoMoveIndex detection: match 'bom.glb' anywhere
  const autoMoveIndex = modelsMeta.findIndex(m=> m.url && m.url.toLowerCase().includes('bom.glb'));
  let autoMoveActive = autoMoveIndex !== -1;
  let autoMoveStartTime = null;
  const AUTO_MOVE_MAX_MS = 15000;
  let autoMoveMaxMs = AUTO_MOVE_MAX_MS;

  function setActiveButton(index){ modelsMeta.forEach((m,i)=>{ if(m._button)m._button.classList.toggle('active',i===index); }); }

  const startBtn = document.createElement('div'); startBtn.className='btn'; startBtn.textContent='Start Auto-move';
  const stopBtn = document.createElement('div'); stopBtn.className='btn'; stopBtn.textContent='Stop Auto-move';
  const loopBtn = document.createElement('div'); loopBtn.className='btn'; loopBtn.textContent='Loop: Off';
  ui.appendChild(startBtn); ui.appendChild(stopBtn); ui.appendChild(loopBtn);

  const focusNameBtn = document.createElement('div'); focusNameBtn.className='btn'; focusNameBtn.textContent = 'Focus: นาย ภูวเรศ';
  focusNameBtn.onclick = ()=>{
    const idx = 1;
    if(!models[idx]){ status.textContent = 'Model not loaded yet'; return; }
    let lookAtWorld = undefined;
    if(modelsMeta[idx] && modelsMeta[idx].lookAt && Array.isArray(modelsMeta[idx].lookAt) && modelsMeta[idx].lookAt.length>=3){
      lookAtWorld = new THREE.Vector3(modelsMeta[idx].lookAt[0], modelsMeta[idx].lookAt[1], modelsMeta[idx].lookAt[2]);
    }
    focusOnModel(models[idx], 0, lookAtWorld);
    setActiveButton(idx);
  };
  ui.appendChild(focusNameBtn);

  const menuHandle = document.getElementById('menuHandle');
  function showMenu(){ menu.classList.remove('collapsed'); menu.style.display = 'flex'; if(menuToggle){ menuToggle.textContent = '✕'; menuToggle.title='Close menu'; } if(menuHandle) menuHandle.style.display='none'; }
  function hideMenu(){ menu.classList.add('collapsed'); menu.style.display = 'none'; if(menuToggle){ menuToggle.textContent = '☰'; menuToggle.title='Open menu'; } if(menuHandle) menuHandle.style.display='block'; }
  if(menuToggle){ menuToggle.onclick = ()=>{ hideMenu(); }; }
  if(menuHandle){ menuHandle.onclick = ()=>{ showMenu(); }; }

  startBtn.onclick = ()=>{ if(autoMoveIndex===-1) { status.textContent='No bom model found to auto-move.'; return; } if(!models[autoMoveIndex]) { status.textContent='bom model not yet loaded.'; return; } autoMoveActive = true; autoMoveStartTime = performance.now(); status.textContent = `Auto-move started (max ${Math.round(autoMoveMaxMs/1000)}s)`; };
  stopBtn.onclick = ()=>{ autoMoveActive = false; status.textContent = 'Auto-move stopped (manual)'; };

  let loopEnabled = true;
  loopBtn.textContent = 'Loop: Auto';
  loopBtn.onclick = ()=>{ loopEnabled = !loopEnabled; loopBtn.textContent = `Loop: ${loopEnabled? 'On':'Off'}`; status.textContent = `Loop ${loopEnabled? 'enabled':'disabled'}`; };
  status.textContent = 'Looping auto-move is ON';

  modelsMeta.forEach((m,i)=>{
    if(i>=9){
      const btn=document.createElement('div');
      btn.className='btn'; btn.textContent=m.name || `Model ${i}`;
      btn.onclick=()=>{
        if(models[i]){
          let lookAtWorld = undefined;
          if(modelsMeta[i] && modelsMeta[i].lookAt && Array.isArray(modelsMeta[i].lookAt) && modelsMeta[i].lookAt.length>=3){
            lookAtWorld = new THREE.Vector3(modelsMeta[i].lookAt[0], modelsMeta[i].lookAt[1], modelsMeta[i].lookAt[2]);
          }
          focusOnModel(models[i], 0, lookAtWorld);
          setActiveButton(i);
        }
      };
      ui.appendChild(btn); m._button=btn;
    }
  });
  window.__bomShaderUniformsList = window.__bomShaderUniformsList || [];

  // ensure attributes
  function ensureBomVertexAttributes(root){
    root.traverse(node=>{
      if(!node.isMesh) return;
      const geom = node.geometry;
      if(!geom || !geom.attributes || !geom.attributes.position) return;
      const posAttr = geom.attributes.position;
      const count = posAttr.count;
      const bbox = new THREE.Box3().setFromBufferAttribute(posAttr);
      const minY = bbox.min.y, maxY = bbox.max.y;
      const h = Math.max(0.0001, maxY - minY);
      if(!geom.getAttribute('aWeight')){
        const weight = new Float32Array(count);
        for(let i=0;i<count;i++){
          const vy = posAttr.array[i*3 + 1];
          let n = (vy - minY) / h; n = Math.max(0, Math.min(1, n));
          weight[i] = n*n*(3 - 2*n);
        }
        geom.setAttribute('aWeight', new THREE.BufferAttribute(weight, 1));
      }
      if(!geom.getAttribute('aPhase')){
        const phase = new Float32Array(count);
        for(let i=0;i<count;i++) phase[i] = Math.random() * Math.PI * 2.0;
        geom.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
      }
      posAttr.needsUpdate = true;
    });
  }

  // Helper: safe fetch check (timeout)
  function fetchWithTimeout(url, timeout=4000){
    return new Promise((resolve)=>{
      const timer = setTimeout(()=>{ resolve({ok:false, error:'timeout'}); }, timeout);
      fetch(url, {method:'HEAD'}).then(r=>{ clearTimeout(timer); resolve(r); }).catch(e=>{ clearTimeout(timer); resolve({ok:false, error:e}); });
    });
  }

  async function loadModels(){
    loadedCount = 0;
    status.textContent = 'Starting model load...';
    for(let i=0;i<modelsMeta.length;i++){
      const m = modelsMeta[i];
      try{
        // quick HEAD check to fail fast on 404/CORS when possible
        let reachable = true;
        try{
          const check = await fetchWithTimeout(m.url, 3500);
          if(!check || !check.ok){ reachable = false; }
        }catch(e){ reachable = false; }

        if(!reachable){
          console.warn('Skipping unreachable model:', m.url);
          status.textContent = `Skipping unreachable model ${i}`;
          loadedCount++;
          continue;
        }

        await new Promise((resolve)=>{
          loader.load(m.url, (gltf)=>{
            try{
              const root = gltf.scene || gltf.scenes && gltf.scenes[0];
              if(!root){ console.warn('GLTF has no scene root', m.url); loadedCount++; return resolve(); }

              const isBom = m.url && m.url.toLowerCase().includes('bom.glb');
              if(isBom){
                try{ ensureBomVertexAttributes(root); }catch(e){ console.warn('ensureBomVertexAttributes failed', e); }
                const bomUniforms = {
                  uTime: { value: 0.0 }, uWindAmp: { value: 0.22 }, uWindFreq: { value: 1.0 }, uGust: { value: 1.0 }, uTwist: { value: 1.0 }, uVibe: { value: 0.3 }, uColorA: { value: new THREE.Color(0.9,0.6,0.2) }, uColorB: { value: new THREE.Color(0.2,0.6,0.9) }, uLightDir:{ value:new THREE.Vector3(0.5,0.8,0.3).normalize() }
                };

                const vertexShader = `precision mediump float; attribute float aWeight; attribute float aPhase; uniform float uTime; uniform float uWindAmp; uniform float uWindFreq; uniform float uGust; uniform float uTwist; uniform float uVibe; varying vec2 vUv; varying vec3 vNormal; varying vec3 vWorldPos; void main(){ vUv = uv; vNormal = normalMatrix * normal; vec3 p = position; float w = clamp(aWeight, 0.0, 1.0); float t = uTime; float spatial = p.x * 0.13 + p.y * 0.11 + p.z * 0.09; float swayX = sin( (t * uWindFreq) + spatial + aPhase * 1.37 ) * (uWindAmp * 1.0) * pow(w,1.4) * uGust; float swayY = sin( (t * uWindFreq * 1.2) + spatial*0.7 + aPhase * 0.73 ) * (uWindAmp * 0.45) * pow(w,1.1) * uGust; float swayZ = sin( (t * uWindFreq * 0.85) + spatial*1.1 + aPhase * 1.9 ) * (uWindAmp * 1.2) * pow(w,1.6) * uGust; float angle = sin( t * uWindFreq * 0.6 + aPhase ) * 0.18 * uTwist * w; float c = cos(angle), s = sin(angle); float rx = p.x * c - p.z * s; float rz = p.x * s + p.z * c; float vibe = sin(t * 20.0 + aPhase*7.0) * uVibe * (0.25 + 0.75 * w); vec3 displaced = vec3(rx + swayX, p.y + swayY + vibe, rz + swayZ); displaced += normalize(normal) * (uWindAmp * 0.08 * w * uGust); vec4 mvPos = modelViewMatrix * vec4(displaced, 1.0); vWorldPos = (modelMatrix * vec4(displaced,1.0)).xyz; gl_Position = projectionMatrix * mvPos; }`;

                const fragmentShader = `precision mediump float; uniform vec3 uColorA; uniform vec3 uColorB; uniform vec3 uLightDir; varying vec2 vUv; varying vec3 vNormal; varying vec3 vWorldPos; void main(){ vec3 N = normalize(vNormal); float lam = max(dot(N, normalize(uLightDir)), 0.0); float t = smoothstep(-0.5, 2.5, vWorldPos.y); vec3 base = mix(uColorA, uColorB, t + vUv.y * 0.12); float rim = pow(1.0 - max(dot(N, vec3(0.0, 0.6, 0.8)), 0.0), 2.0) * 0.12; vec3 col = base * (0.28 + lam * 0.72) + rim; gl_FragColor = vec4(col, 1.0); }`;

                root.traverse(n=>{
                  if(n.isMesh){
                    try{ if(n.geometry) n.geometry = n.geometry.clone(); }catch(e){}
                    try{
                      const mat = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms: THREE.UniformsUtils.clone(bomUniforms), side: THREE.DoubleSide });
                      n.material && (n.material.dispose && n.material.dispose());
                      n.material = mat;
                      n.castShadow = true; n.receiveShadow = true;
                      // depth material (best-effort) - if this fails, continue without shadows for this mesh
                      try{
                        const depthFrag = 'void main(){ gl_FragColor = vec4(1.0); }';
                        const depthMat = new THREE.ShaderMaterial({ vertexShader, fragmentShader:depthFrag, uniforms: THREE.UniformsUtils.clone(bomUniforms), side:THREE.DoubleSide });
                        n.customDepthMaterial = depthMat; n.customDistanceMaterial = depthMat;
                      }catch(e){ console.warn('depth material failure', e); }

                      if(mat.uniforms && mat.uniforms.uTime) window.__bomShaderUniformsList.push(mat.uniforms);
                    }catch(e){ console.warn('Failed to assign ShaderMaterial for bom mesh', e); }
                  }
                });

              } else {
                if(!m.noToon){
                  root.traverse(n=>{ if(n.isMesh && n.material){ if(Array.isArray(n.material)) n.material = n.material.map(toToonMaterial); else n.material = toToonMaterial(n.material); } });
                }
              }

              root.scale.set(m.scale||1,m.scale||1,m.scale||1);
              if(Array.isArray(m.pos)) root.position.set(...m.pos);
              root.userData.name = m.name || (`Model ${i}`);
              root.traverse(c=>{ if(c.isMesh){c.castShadow=true; c.receiveShadow=true;} });
              scene.add(root); models[i]=root; loadedCount++;

              const bbox = new THREE.Box3().setFromObject(root);
              const center = new THREE.Vector3(); bbox.getCenter(center);
              if(!cameraAnchors[i]){
                if(m.cameraAnchors && Array.isArray(m.cameraAnchors) && m.cameraAnchors.length>0){ cameraAnchors[i] = m.cameraAnchors.map(a=> new THREE.Vector3(a[0], a[1], a[2])); }
                else cameraAnchors[i] = [ center.clone().add(new THREE.Vector3(0,2,5)), center.clone().add(new THREE.Vector3(2,2,5)), center.clone().add(new THREE.Vector3(-2,2,5)) ];
              }
              root.userData._anchorIndex = root.userData._anchorIndex || 0;
              if(i===autoMoveIndex && models[i]) models[i].userData.__initialPosition = models[i].position.clone();
              setEnvironmentIntensity(envIntensity);
              status.textContent = `Loaded ${loadedCount}/${modelsMeta.length}`;
            }catch(e){ console.error('Error processing gltf', m.url, e); }
            resolve();
          }, undefined, (err)=>{
            // loader error -> log with details but don't throw
            console.error('Model load error', m.url, err && (err.message || err));
            status.textContent = `Failed to load model ${i}: ${m.url}`;
            loadedCount++;
            resolve();
          });
        });
      }catch(e){ console.error('Unexpected load error for', m.url, e); loadedCount++; }
    }
    status.textContent = 'All model load attempts complete';
  }

  const preBar = document.getElementById('preBar');
  const prePercent = document.getElementById('prePercent');
  const preEnter = document.getElementById('preEnter');
  let preValue = 0;
  function advancePreloader(){ if(preValue >= 100) return; preValue += Math.ceil(Math.random()*4); if(preValue > 100) preValue = 100; if(preBar) preBar.style.width = preValue + '%'; if(prePercent) prePercent.textContent = preValue + '%'; if(preValue >= 100){ preEnter.disabled = false; preEnter.style.cursor='pointer'; preEnter.style.background='#2a6bd6'; preEnter.textContent='เข้าชมผลงาน'; } else { setTimeout(advancePreloader, 120 + Math.random()*240); } }
  advancePreloader();

  preEnter.onclick = async ()=>{ if(preValue < 100) return; const overlay = document.getElementById('preloadOverlay'); if(overlay) overlay.style.display='none'; await loadModels(); };

  renderer.domElement.addEventListener('pointerdown', ev=>{
    const rect=renderer.domElement.getBoundingClientRect(); pointer.x=((ev.clientX-rect.left)/rect.width)*2-1; pointer.y=-((ev.clientY-rect.top)/rect.height)*2+1; raycaster.setFromCamera(pointer,camera);
    const intersects=raycaster.intersectObjects(scene.children,true);
    if(intersects.length>0){ let hit=intersects[0].object; while(hit && !hit.userData.name) hit=hit.parent; if(hit && hit.userData.name){ const idx=models.findIndex(m=>m===hit); let lookAtWorld = undefined; if(idx!==-1 && modelsMeta[idx] && modelsMeta[idx].lookAt && Array.isArray(modelsMeta[idx].lookAt) && modelsMeta[idx].lookAt.length>=3){ lookAtWorld = new THREE.Vector3(modelsMeta[idx].lookAt[0], modelsMeta[idx].lookAt[1], modelsMeta[idx].lookAt[2]); } const anchorIndex = (models[idx] && models[idx].userData && typeof models[idx].userData._anchorIndex === 'number') ? models[idx].userData._anchorIndex : 0; focusOnModel(models[idx] || hit, anchorIndex, lookAtWorld); if(idx!==-1) setActiveButton(idx); } }
  });

  let cameraAnim={ running:false, startTime:0, duration:700, fromPos:new THREE.Vector3(), toPos:new THREE.Vector3(), fromTarget:new THREE.Vector3(), toTarget:new THREE.Vector3() };
  function focusOnModel(model, anchorIndex=0){ const bbox=new THREE.Box3().setFromObject(model); const center=new THREE.Vector3(); bbox.getCenter(center); const idx = models.indexOf(model); let desiredCamPos; if(cameraAnchors[idx] && cameraAnchors[idx][anchorIndex]) desiredCamPos = cameraAnchors[idx][anchorIndex].clone(); else desiredCamPos = center.clone().add(new THREE.Vector3(0,1.2,3)); cameraAnim.running=true; cameraAnim.startTime=performance.now(); cameraAnim.fromPos.copy(camera.position); cameraAnim.toPos.copy(desiredCamPos); cameraAnim.fromTarget.copy(controls.target); cameraAnim.toTarget.copy(center); }

  window.addEventListener('resize', ()=>{ camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

  let lastTime = performance.now();
  function checkIntersectionWithOthers(moveIndex){ const mover = models[moveIndex]; if(!mover) return -1; const moverBox = new THREE.Box3().setFromObject(mover); for(let i=0;i<models.length;i++){ if(i===moveIndex) continue; if(i===0) continue; if(modelsMeta[i] && modelsMeta[i].url && modelsMeta[i].url.includes(skipCollisionUrlFragment)) continue; const other = models[i]; if(!other) continue; const otherBox = new THREE.Box3().setFromObject(other); if(moverBox.intersectsBox(otherBox)) return i; } return -1; }

  function disposeModel(obj){ if(!obj) return; obj.traverse(n=>{ if(n.geometry){ n.geometry.dispose(); } if(n.material){ if(Array.isArray(n.material)) n.material.forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); }); else { if(n.material.map) n.material.map.dispose(); n.material.dispose(); } } }); }

  const windMeshes = []; let windInitializedForTree = false; const treeModelIndex = modelsMeta.findIndex(m => m.url && m.url.toLowerCase().includes('tree.glb'));
  function markWindOnModel(root){ root.traverse(node=>{ if(!node.isMesh) return; try{ const geom = node.geometry.clone(); node.geometry = geom; const posAttr = geom.attributes.position; const normAttr = geom.attributes.normal; if(!posAttr) return; const base = new Float32Array(posAttr.array.length); base.set(posAttr.array); const bbox = new THREE.Box3().setFromBufferAttribute(posAttr); const minY = bbox.min.y, maxY = bbox.max.y; const height = Math.max(0.0001, maxY - minY); const vertexWeight = new Float32Array(base.length / 3); for(let v=0, j=0; v<vertexWeight.length; v++, j+=3){ const vy = base[j+1]; const n = (vy - minY) / height; const w = n*n*(3 - 2*n); vertexWeight[v] = w; } windMeshes.push({ mesh: node, geometry: geom, basePos: base, vertexWeight: vertexWeight, normalAttr: normAttr ? normAttr.array : null, amp: 0.18 * (node.userData.windScale || 1.0), freq: 0.9 + Math.random()*0.6, phaseOffset: Math.random() * Math.PI * 2, gustSensitivity: 0.9 + Math.random()*0.6 }); node.castShadow = true; node.receiveShadow = true; }catch(e){ console.warn('markWindOnModel error', e); } }); }
  function updateWindMeshes(){ if(windMeshes.length === 0) return; const t = performance.now() / 1000; const gust = 1.0 + Math.sin(t * 0.35) * 0.6 + Math.sin(t * 0.08 + 1.3) * 0.9; const gustClamped = Math.max(0.2, Math.min(2.5, gust)); for(let i=0;i<windMeshes.length;i++){ const info = windMeshes[i]; const geom = info.geometry; const posAttr = geom.attributes.position; const base = info.basePos; const normals = info.normalAttr; const weights = info.vertexWeight; const amp = info.amp; const freq = info.freq; const phase = info.phaseOffset; const gSens = info.gustSensitivity; for(let v=0, j=0; v<weights.length; v++, j+=3){ const bx = base[j+0], by = base[j+1], bz = base[j+2]; const w = weights[v]; const spatial = bx*0.15 + by*0.12 + bz*0.09; const wobble = Math.sin(t * freq + spatial + phase); const tipFactor = Math.pow(w, 1.6); const strength = wobble * amp * tipFactor * (1 + (gustClamped-1) * gSens); if(normals){ posAttr.array[j+0] = bx + normals[j+0] * strength; posAttr.array[j+1] = by + normals[j+1] * strength * 0.6; posAttr.array[j+2] = bz + normals[j+2] * strength; } else { posAttr.array[j+0] = bx + Math.sin(spatial + t*freq) * strength * 1.1; posAttr.array[j+1] = by + Math.cos(spatial*0.5 + t*freq*0.8) * (strength*0.35); posAttr.array[j+2] = bz + Math.cos(spatial + t*freq) * strength * 0.9; } } posAttr.needsUpdate = true; } }
  function ensureWindInit(){ if(windInitializedForTree) return; if(treeModelIndex !== -1 && models[treeModelIndex]){ const root = models[treeModelIndex]; try{ markWindOnModel(root); windInitializedForTree = true; console.log('Wind: initialized on tree model index', treeModelIndex); }catch(e){ console.warn('Wind init failed', e); } } }
  (function startWindLoop(){ function loop(){ ensureWindInit(); updateWindMeshes(); requestAnimationFrame(loop); } requestAnimationFrame(loop); })();

  function animate(){ if(window.__bomShaderUniformsList && window.__bomShaderUniformsList.length){ const tsec = performance.now() / 1000; for(const u of window.__bomShaderUniformsList){ if(u.uTime) u.uTime.value = tsec; } }
    requestAnimationFrame(animate);
    const now = performance.now(); const dt = (now - lastTime) / 5000; lastTime = now;
    if(autoMoveActive && autoMoveIndex !== -1 && models[autoMoveIndex]){
      const nowAuto = performance.now(); if(autoMoveStartTime === null) autoMoveStartTime = nowAuto; const elapsedMs = nowAuto - autoMoveStartTime; const maxMs = autoMoveMaxMs; if(elapsedMs <= maxMs){ const moveDt = dt; const speed = 0.8; const dx = speed * moveDt; models[autoMoveIndex].position.x += dx; const hit = checkIntersectionWithOthers(autoMoveIndex); if(hit !== -1){ console.log('Auto-move: collision with model', hit, '; collision ignored, continuing.'); status.textContent = `Auto-move: collision ignored (model ${hit})`; } } else { if(loopEnabled && models[autoMoveIndex]){ const init = models[autoMoveIndex].userData && models[autoMoveIndex].userData.__initialPosition; if(init){ models[autoMoveIndex].position.copy(init); } autoMoveStartTime = performance.now(); status.textContent = `Auto-move loop restarted`; } else { autoMoveActive = false; status.textContent = `Auto-move finished (${Math.round(autoMoveMaxMs/1000)}s)`; } } }
    if(cameraAnim.running){ const t=Math.min(1,(performance.now()-cameraAnim.startTime)/cameraAnim.duration); const ease=t*t*(3-2*t); camera.position.lerpVectors(cameraAnim.fromPos,cameraAnim.toPos,ease); controls.target.lerpVectors(cameraAnim.fromTarget,cameraAnim.toTarget,ease); controls.update(); if(t>=1) cameraAnim.running=false; }
    updateRain(); renderer.render(scene,camera);
  }
  animate();
  </script>
</body>
</html>
